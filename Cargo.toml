[workspace]
resolver = "3"
members = [
    "crates/axe-cli",
    "crates/axe-core",
    "crates/axe-adapters",
    "crates/axe-daemon",
    "crates/axe-service-gen",
    "crates/axe-test-fixtures",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taytrix/axe"
readme = false

[workspace.dependencies]
axe-core         = { path = "crates/axe-core" }
axe-adapters     = { path = "crates/axe-adapters" }
axe-daemon       = { path = "crates/axe-daemon" }
axe-service-gen  = { path = "crates/axe-service-gen" }
axe-test-fixtures = { path = "crates/axe-test-fixtures" }

anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.9"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap        = { version = "4", features = ["derive", "env"] }
camino      = { version = "1", features = ["serde1"] }
indexmap    = { version = "2", features = ["serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
