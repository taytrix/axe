[project]
name = "axe"
version = "0.3.0"
description = "Conan Exiles Enhanced dedicated-server CLI"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.7",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "tomlkit>=0.13",
]

[project.scripts]
axe = "axe.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.7",
    "ty",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axe"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
